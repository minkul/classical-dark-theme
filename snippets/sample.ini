; Sample INI file covering language tokens.
# Hash comments are also common.

[general]
name = classical-dark-theme
version = 1.0.0
enabled = true
max_retries = 3
ratio = 0.75

[database]
host = "localhost"
port = 5432
user = 'admin'
path = C:\data\app.db

[logging.file]
level = INFO
format = %(asctime)s - %(levelname)s - %(message)s
